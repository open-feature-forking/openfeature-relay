site_name: OpenFeature Relay
site_description: A builder and runtime for flag relays, with flagd as the reference distribution
theme:
  name: material
  palette: 
      # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-outline
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  logo: assets/logo-white.svg
  favicon: assets/logo-white.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
extra_css:
  - assets/extra.css

docs_dir: docs
# The PlantUML source is linked from the use cases, not rendered
exclude_docs: |
  /use_cases.puml
repo_url: https://github.com/open-feature-forking/openfeature-relay
repo_name: open-feature-forking/openfeature-relay
edit_uri: edit/main/docs/
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      # linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

