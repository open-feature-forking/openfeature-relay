version: "2"
linters:
  enable:
    - depguard
  settings:
    funlen:
      statements: 50
    depguard:
      rules:
        # These sit outside the FIPS 140-3 validated module boundary.
        # See docs/reference/fips-140-3.md.
        fips-140-3:
          files:
            - "!$test"
          deny:
            - pkg: golang.org/x/crypto
              desc: use the stdlib crypto/* equivalent so the call routes through the validated Go Cryptographic Module
            - pkg: crypto/md5
              desc: MD5 is not an approved algorithm and is not part of the validated module
            - pkg: crypto/sha1
              desc: SHA-1 is not an approved algorithm and is not part of the validated module
            - pkg: crypto/des
              desc: DES/3DES is not an approved algorithm
            - pkg: crypto/rc4
              desc: RC4 is not an approved algorithm
        # The evaluator and the configuration formats stay free of transport, telemetry and platform
        # dependencies (NFR-005). The check-evaluator-boundary make target covers transitive imports.
        evaluator-boundary:
          files:
            - "**/core/pkg/evaluator/**"
            - "**/evaluator/**"
            - "**/core/pkg/configformat/**"
            - "**/configformat/**"
          deny:
            - pkg: go.opentelemetry.io
              desc: the evaluator imports no telemetry; flagd records spans around it
            - pkg: google.golang.org/grpc
              desc: the evaluator imports no transport
            - pkg: connectrpc.com
              desc: the evaluator imports no transport
            - pkg: k8s.io
              desc: the evaluator imports no platform clients
            - pkg: gocloud.dev
              desc: the evaluator imports no platform clients
        configformat-no-evaluator:
          files:
            - "**/core/pkg/configformat/**"
            - "**/configformat/**"
          deny:
            - pkg: github.com/open-feature-forking/openfeature-relay/core/pkg/evaluator
              desc: a configuration format knows no evaluator; evaluators read the documents formats store
            - pkg: github.com/open-feature-forking/openfeature-relay/evaluator/
              desc: a configuration format knows no evaluator module
            - pkg: github.com/diegoholiveira/jsonlogic
              desc: a configuration format knows no evaluator engine
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/
              desc: a configuration format knows no sync provider
        # The Flagsmith engine module has no transport, telemetry or platform client of its own. The module boundaries
        # cover the packages transitively; net/http stays out of its own imports, though zap, through the core logger,
        # still links it.
        flagsmith-engine-boundary:
          files:
            - "!$test"
            - "**/contrib/flagsmith/engine/**"
          deny:
            - pkg: net/http
              desc: the engine module imports no transport
            - pkg: go.opentelemetry.io
              desc: the engine module imports no telemetry
            - pkg: google.golang.org/grpc
              desc: the engine module imports no transport
            - pkg: connectrpc.com
              desc: the engine module imports no transport
            - pkg: github.com/go-resty
              desc: the engine module imports no HTTP client
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/
              desc: an engine module knows no sync provider
            - pkg: github.com/open-feature-forking/openfeature-relay/telemetry/
              desc: an engine module knows no telemetry provider
            - pkg: github.com/open-feature-forking/openfeature-relay/service/
              desc: an engine module knows no service endpoint
        # flagd's service endpoints and runtime record through the telemetry provider they are injected with.
        # Depguard checks direct imports only: the module boundaries cover the service endpoints transitively. The
        # runtime reaches OpenTelemetry through the sync providers of the GCS module, which no check can forbid yet.
        telemetry-through-provider:
          files:
            - "!$test"
            - "**/service/transport/**"
            - "**/service/flag-evaluation/**"
            - "**/service/ofrep/**"
            - "**/service/flag-sync/**"
            - "**/service/event-collector/**"
            - "**/runtime/**"
          deny:
            - pkg: go.opentelemetry.io
              desc: record spans and metrics through the injected telemetry provider
            - pkg: github.com/prometheus/client_golang
              desc: the telemetry provider serves the metrics
            - pkg: connectrpc.com/otelconnect
              desc: the telemetry provider instruments ConnectRPC
            - pkg: github.com/open-feature-forking/openfeature-relay/telemetry/
              desc: only the distribution's command selects a telemetry provider
        # The runtime serves the components it is given and imports none of them (UC-001, Q6 and Q15): flagd-full's list is
        # the flagd/components package. The module boundaries cover the packages transitively.
        runtime-holds-no-component:
          files:
            - "!$test"
            - "**/runtime/**"
          deny:
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/file
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/http
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/flagd-grpc
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/openfeature-operator
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/gcs
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/azblob
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/s3
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/sync/builder/official
              desc: the runtime holds no sync provider; the distribution passes Components.Sync
            - pkg: github.com/open-feature-forking/openfeature-relay/evaluator/
              desc: the runtime holds no evaluator; the distribution passes Components.Evaluators
            - pkg: github.com/open-feature-forking/openfeature-relay/configformat/
              desc: the runtime holds no configuration format; the distribution passes Components.ConfigurationFormats
            - pkg: github.com/open-feature-forking/openfeature-relay/service/flag-evaluation
              desc: the runtime holds no service endpoint; the distribution passes Components.Endpoints
            - pkg: github.com/open-feature-forking/openfeature-relay/service/flag-sync
              desc: the runtime holds no service endpoint; the distribution passes Components.Endpoints
            - pkg: github.com/open-feature-forking/openfeature-relay/service/event-collector
              desc: the runtime holds no service endpoint; the distribution passes Components.Endpoints
        stable-dependencies:
          deny:
            - pkg: golang.org/x/exp
              desc: use the standard library; x/exp has no compatibility promise
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - dupl
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - lll
          - maligned
          - noctx
          - scopelint
          - staticcheck
        path: _test.go
      - path: (.+)\.go$
        text: pkg/generated
    paths:
      - (^|/)bin($|/)
      - (^|/)examples($|/)
      - (^|/)schemas($|/)
      - (^|/)test-harness($|/)
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
